[registry]
schema_version = 1
full_gate = "just check"
release_gate = "just check-all"
expected_modules = ["agents", "config", "hives", "planning", "state", "work", "worktrees"]

[[closures]]
id = "kernel"
kind = "kernel"
status = "present"
owner_path = "src/beadhive/operation_catalog.py"
