tests = ["tests/test_operation_catalog.py", "tests/unit/test_pure_module_independence.py"]
shared_contracts = ["contracts"]
shared_contract_tests = ["tests/unit/testing/test_conformance_testkit.py"]
reverse_dependencies = ["adapters"]
reverse_dependency_tests = ["tests/test_cli_projection.py", "tests/test_mcp_catalog_projection.py"]

[[closures]]
