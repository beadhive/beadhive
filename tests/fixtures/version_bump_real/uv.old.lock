version = 1

[[package]]
name = "beadhive"
version = "0.29.5"
source = { editable = "." }
dependencies = [
    { name = "attrs" },
    { name = "cryptography" },
    { name = "fastmcp" },
    { name = "httpx" },
    { name = "joserfc" },
    { name = "jsonschema" },
    { name = "packaging" },
    { name = "pydantic-settings" },
    { name = "pymysql" },
    { name = "ruamel-yaml" },
    { name = "starlette" },
    { name = "structlog" },
    { name = "typer" },
    { name = "uvicorn" },
]

[package.optional-dependencies]
otel = [
    { name = "opentelemetry-exporter-otlp" },
    { name = "opentelemetry-sdk" },
    { name = "structlog" },
]
pants = [
    { name = "beadhive-pants" },
]
release-verify = [
    { name = "sigstore" },
]

[package.dev-dependencies]
core = [
    { name = "beadhive-bd-cli" },
    { name = "beadhive-beads-client" },
    { name = "beadhive-core" },
]
dev = [
    { name = "commitizen" },
    { name = "editables" },
    { name = "hatchling" },
    { name = "hypothesis" },
    { name = "jsonschema" },
    { name = "moto", extra = ["server"] },
    { name = "openapi-python-client" },
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "pytest-timeout" },
    { name = "pytest-xdist" },
    { name = "ruff" },
    { name = "time-machine" },
]
hq-storage = [
    { name = "beadhive-hq-storage" },
    { name = "beadhive-hq-storage-dolt" },
]
pants = [
    { name = "beadhive-pants" },
]
plugins = [
    { name = "beadhive-plugins" },
]
validation-broker = [
    { name = "beadhive-validation-broker" },
]
worktrees = [
    { name = "beadhive-worktrees" },
]

[package.metadata]
requires-dist = [
    { name = "attrs", specifier = ">=23" },
    { name = "beadhive-pants", marker = "extra == 'pants'", editable = "packages/beadhive-pants" },
    { name = "cryptography", specifier = ">=45" },
    { name = "fastmcp", specifier = ">=3.4,<4" },
    { name = "httpx", specifier = ">=0.28,<1" },
    { name = "joserfc", specifier = ">=1.7,<2" },
    { name = "jsonschema", specifier = ">=4" },
    { name = "opentelemetry-exporter-otlp", marker = "extra == 'otel'", specifier = ">=1.37,<2" },
    { name = "opentelemetry-sdk", marker = "extra == 'otel'", specifier = ">=1.37,<2" },
    { name = "packaging", specifier = ">=24" },
    { name = "pydantic-settings", specifier = ">=2.11" },
    { name = "pymysql", specifier = "==1.1.2" },
    { name = "ruamel-yaml", specifier = ">=0.18" },
    { name = "sigstore", marker = "extra == 'release-verify'", specifier = ">=4,<5" },
    { name = "starlette", specifier = ">=0.47,<2" },
    { name = "structlog", specifier = ">=24" },
    { name = "structlog", marker = "extra == 'otel'", specifier = ">=24" },
    { name = "typer", specifier = ">=0.12" },
    { name = "uvicorn", specifier = ">=0.34,<1" },
]
provides-extras = ["mcp", "otel", "release-verify", "pants"]

[package.metadata.requires-dev]
core = [
    { name = "beadhive-bd-cli", editable = "packages/beadhive-bd-cli" },
    { name = "beadhive-beads-client", editable = "packages/beadhive-beads-client" },
    { name = "beadhive-core", editable = "packages/beadhive-core" },
]
dev = [
    { name = "commitizen", specifier = ">=4.16.4" },
    { name = "editables", specifier = ">=0.5" },
    { name = "hatchling" },
    { name = "hypothesis", specifier = ">=6.100" },
    { name = "jsonschema", specifier = ">=4" },
    { name = "moto", extras = ["server"], specifier = ">=5.1" },
    { name = "openapi-python-client", specifier = "==0.29.1" },
    { name = "pytest", specifier = ">=8" },
    { name = "pytest-cov", specifier = ">=5" },
    { name = "pytest-timeout", specifier = ">=2.4" },
    { name = "pytest-xdist", specifier = ">=3" },
    { name = "ruff", specifier = ">=0.6" },
    { name = "time-machine", specifier = ">=3.5.1" },
]
hq-storage = [
    { name = "beadhive-hq-storage", editable = "packages/beadhive-hq-storage" },
    { name = "beadhive-hq-storage-dolt", editable = "packages/beadhive-hq-storage-dolt" },
]
pants = [{ name = "beadhive-pants", editable = "packages/beadhive-pants" }]
plugins = [{ name = "beadhive-plugins", editable = "packages/beadhive-plugins" }]
validation-broker = [{ name = "beadhive-validation-broker", editable = "packages/beadhive-validation-broker" }]
worktrees = [{ name = "beadhive-worktrees", editable = "packages/beadhive-worktrees" }]
