# Allowlist for scripts/check_test_wall_clock.py (bh-zbn8a, epic bh-vcx4i).
#
# Every entry is an accepted wall-clock wait in tests/: `path` + `anchor` (enclosing function
# qualname, or `<module>`) + `kind` (`sleep` | `elapsed-assert`) + a `reason`. A new sleep or
# measured-duration assert fails the check unless it is added here WITH a reason; an entry whose
# finding disappears is reported stale and must be deleted, so the list only shrinks.
#
# Prefer FakeClock / time-machine / a readiness handshake (docs/TEST_PROCESS_POLICY.md, "Time in
# tests"). Latency or overlap budgets belong under `@pytest.mark.perf`, which is exempt here
# because the gate deselects it.
#
# WATCH ITEM (unconfirmed host contention, bh-p4bbw): tests/test_hq_authority_backend.py::
# test_real_foreign_holder_takeover_requires_authenticated_incumbent_evidence failed once under
# 3-way concurrent runs. It is not a known wall-clock bug; if it recurs, diagnose contention first.

