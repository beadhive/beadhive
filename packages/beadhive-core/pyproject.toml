[project]
name = "beadhive-core"
version = "0.1.0"
description = "API-first Beadhive command handlers over the pinned Beads v1.3 session"
requires-python = ">=3.11"
# The core depends on the Beads client package only; it never imports root `beadhive`.
dependencies = ["beadhive-beads-client"]
classifiers = ["Private :: Do Not Upload"]

[tool.uv.sources]
beadhive-beads-client = { workspace = true }

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadhive_core"]
