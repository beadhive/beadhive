[project]
name = "beadhive-hq-storage"
version = "0.1.0"
description = "Backend-neutral HQ storage port, in-memory fake and contract suite for Beadhive (scaffold)"
requires-python = ">=3.11"
# A LIBRARY package (docs/design/package-class-library-vs-plugin-adr.md): no plugin.json, and
# stdlib only -- it never imports root `beadhive` and has no third-party runtime dependency
# (docs/design/hq-storage-port-adr.md section 7). pytest and hypothesis are imported lazily inside
# the contract helpers and never become runtime dependencies.
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadhive_hq_storage"]
