[project]
name = "beadhive-worktrees"
version = "0.1.0"
description = "Provider-neutral managed-worktree naming, contracts, and native Git provisioner"
requires-python = ">=3.11"
# Depends only on beadhive-plugins — for the capability-slot/binding machinery this package
# uses to declare its `worktree.manager` slot (docs/design/package-class-library-vs-plugin-adr.md
# section 5). It never imports the root `beadhive` distribution.
dependencies = ["beadhive-plugins"]
classifiers = ["Private :: Do Not Upload"]

[tool.uv.sources]
beadhive-plugins = { workspace = true }

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadhive_worktrees"]
