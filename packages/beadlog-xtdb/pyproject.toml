[project]
name = "beadlog-xtdb"
version = "0.1.0"
description = "BeadLog XTDB loader library: pgwire connection, layout (b) rows, transit and column-type discipline (library)"
requires-python = ">=3.11"
# A LIBRARY package (docs/design/package-class-library-vs-plugin-adr.md): no plugin.json. It
# depends on `beadlog`, imported through beadlog's public __all__ surface, and on psycopg for
# XTDB's pgwire port, and never imports root `beadhive` (docs/design/backfill-platform-adr.md
# section 2, beadlog-format-adr.md amendment A6). Transit is written and read by an in-package
# subset codec (src/beadlog_xtdb/_transit.py), so there is no transit-python2 dependency. The
# plugin that binds this loader into `bh backfill` is a separate package (beadhive-beadlog-xtdb).
dependencies = ["beadlog", "psycopg[binary]>=3.2,<4"]
classifiers = ["Private :: Do Not Upload"]

[tool.uv.sources]
beadlog = { workspace = true }

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadlog_xtdb"]
