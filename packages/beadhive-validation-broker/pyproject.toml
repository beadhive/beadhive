[project]
name = "beadhive-validation-broker"
version = "0.1.0"
description = "Validation broker port, job and lease model, and in-memory fake for Beadhive (library)"
requires-python = ">=3.11"
# A LIBRARY package (docs/design/package-class-library-vs-plugin-adr.md): no plugin.json, and
# stdlib only -- it never imports root `beadhive` and has no third-party runtime dependency
# (docs/design/validation-broker-adr.md). pytest is imported lazily inside the conformance
# helpers and never becomes a runtime dependency.
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadhive_validation_broker"]
