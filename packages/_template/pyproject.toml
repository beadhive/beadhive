# Template for an in-repo package (bh-3fcl0.1). To start a package: copy this directory to
# packages/<name>/, rename the distribution and import package, then run `uv lock`. The root
# workspace glob, Pants source roots, `just pkg`, and the shared `packages` attest key pick it
# up with no further shared-file edits.
[project]
name = "beadhive-package-template"
version = "0.0.0"
description = "Template for an in-repo packages/* distribution; never published"
requires-python = ">=3.11"
# This template is a library package by default: it carries no plugin.json and depends on
# nothing from beadhive (docs/design/package-class-library-vs-plugin-adr.md). To turn a copy
# into a plugin package instead, add "beadhive" here (workspace source, as below) alongside a
# plugin.json manifest and catalog entry.
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadhive_package_template"]
