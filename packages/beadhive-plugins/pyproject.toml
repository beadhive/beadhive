[project]
name = "beadhive-plugins"
version = "0.1.0"
description = "Stdlib-only kernel plugin slot/binding and lifecycle event contracts"
requires-python = ">=3.11"
# Depends on nothing — not even another library package
# (docs/design/package-class-library-vs-plugin-adr.md section 4). Discovery, the lifecycle
# dispatcher, and telemetry stay in root; this package carries only the typed contracts.
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadhive_plugins"]
