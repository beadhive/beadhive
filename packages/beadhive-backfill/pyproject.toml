[project]
name = "beadhive-backfill"
version = "0.1.0"
description = "BeadHive backfill: hive apply envelope and hive-policy pass contracts (library)"
requires-python = ">=3.11"
# A LIBRARY package (docs/design/package-class-library-vs-plugin-adr.md): no plugin.json. It
# depends only on `beadlog` and `beadlog-sources`, each through its public __all__ surface, and
# never imports root `beadhive` (docs/design/backfill-platform-adr.md section 2): root wires the
# bd StoreLoader and the `bh backfill` CLI on top of it.
dependencies = ["beadlog", "beadlog-sources"]
classifiers = ["Private :: Do Not Upload"]

[tool.uv.sources]
beadlog = { workspace = true }
beadlog-sources = { workspace = true }

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadhive_backfill"]
