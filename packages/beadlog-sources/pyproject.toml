[project]
name = "beadlog-sources"
version = "0.1.0"
description = "BeadHive-free BeadLog producers: reconcile, judgment engines and the beadlog CLI (library)"
requires-python = ">=3.11"
# A LIBRARY package (docs/design/package-class-library-vs-plugin-adr.md): no plugin.json. It
# depends only on `beadlog`, imported through beadlog's public __all__ surface, and never imports
# root `beadhive` (docs/design/backfill-platform-adr.md section 2).
dependencies = ["beadlog"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
# `beadlog-sources[haiku]` — HTTP for the opt-in reference judge command `bh-judge-haiku`. Never a
# base dependency: httpx is imported lazily, only by beadlog_sources/haiku.py, and the judge is
# off by default (`backfill.judge.enabled = false`).
haiku = ["httpx>=0.28,<1"]

# `beadlog-sources[md]` — markdown-it-py (MIT) gives the docs reader's markdown adapter a CommonMark
# token stream for headings/sections. Never a base dependency: it is imported lazily by
# beadlog_sources/doc_formats.py, which falls back to a regex scan when it is absent.
md = ["markdown-it-py>=3,<5"]

# Source strategies shipped with this package (entry-point group `beadlog.sources`); each one is
# also a `beadlog extract <name>` subcommand.
[project.entry-points."beadlog.sources"]
bd = "beadlog_sources.bd:BdBaselineStrategy"
bd-history = "beadlog_sources.bd_timeline:BdHistoryStrategy"
docs = "beadlog_sources.docs:DocsStrategy"
git-commits = "beadlog_sources.commits:GitCommitsStrategy"
planning = "beadlog_sources.planning:PlanningStrategy"

# Source readers register under `beadlog.readers` (each is a `beadlog read <name>` subcommand),
# mirrored in the built-in table of beadlog_sources.readers.
[project.entry-points."beadlog.readers"]
docs = "beadlog_sources.docs_reader:DocsReader"
git = "beadlog_sources.git_reader:GitReader"

[project.scripts]
beadlog = "beadlog_sources.cli:main"
bh-judge-haiku = "beadlog_sources.haiku:main"

[tool.uv.sources]
beadlog = { workspace = true }

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadlog_sources"]
