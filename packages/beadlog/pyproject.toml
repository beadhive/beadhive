[project]
name = "beadlog"
version = "0.1.0"
description = "BeadLog format: content-addressed bead history events, merge, fold and diff (library)"
requires-python = ">=3.11"
# A LIBRARY package (docs/design/package-class-library-vs-plugin-adr.md): no plugin.json, and
# stdlib only (docs/design/backfill-platform-adr.md section 2, beadlog-format-adr.md driver 7).
# It never imports root `beadhive`. JSON Schema validation of the published schemas stays in
# root tests; jsonschema is never a runtime dependency of this package.
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadlog"]
