[project]
name = "beadhive-tracker-github"
version = "0.1.0"
description = "GitHub issue tracker adapter plugin for Beadhive (tracker.adapter v1)"
requires-python = ">=3.11"
# A PLUGIN package (it carries plugin.json): root resolves it lazily, by name, only after
# manifest selection (docs/design/tracker-adapter-plugin-adr.md section 1). The root wheel VENDORS
# this import package (bh-lrs9v), so this distribution is never published on its own: the public
# `beadhive[github]` extra carries only githubkit, which is this distribution's own dependency,
# never the root's base one, and is imported only lazily under beadhive_tracker_github/adapter/
# (the `github` dependency group is the editable dev/CI spelling).
# The transitive `hishel` needs the osv-scanner.toml licence override (bh-h8kab), and is capped
# below 2: hishel 2.0.0 fails githubkit's import, which allows it (bh-coqtn).
dependencies = ["beadhive", "githubkit>=0.16.1,<1", "hishel<2"]
classifiers = ["Private :: Do Not Upload"]

[tool.uv.sources]
beadhive = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadhive_tracker_github"]
