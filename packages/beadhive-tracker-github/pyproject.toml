[project]
name = "beadhive-tracker-github"
version = "0.1.0"
description = "GitHub issue tracker adapter plugin for Beadhive (tracker.adapter v1)"
requires-python = ">=3.11"
# A PLUGIN package (it carries plugin.json): root resolves it lazily, by name, only after
# manifest selection (docs/design/tracker-adapter-plugin-adr.md section 1). githubkit is this
# distribution's own dependency, never the root's: the root wheel installs without it, and it
# is imported only lazily under beadhive_tracker_github/adapter/ (the `beadhive[github]` extra
# is the public spelling; the `github` dependency group is the dev/CI one, as for `pants`).
# The transitive `hishel` needs the osv-scanner.toml licence override (bh-h8kab).
dependencies = ["beadhive", "githubkit>=0.16.1,<1"]
classifiers = ["Private :: Do Not Upload"]

[tool.uv.sources]
beadhive = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadhive_tracker_github"]
