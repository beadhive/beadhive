# Git-hook dispatch for this repo. lefthook is the SOLE owner of the one slot git
# provides; every other producer (beads, commitizen, just, bh's push fence) chains
# from here as a job. See docs/design/git-hooks-entrypoint-adr.md (bh-x87q).
#
# Rules that keep this true:
#   1. core.hooksPath stays UNSET — lefthook installs into the default .git/hooks
#   2. nothing writes .git/hooks/* directly
#   3. chaining is a job here, never a separately-installed hook
#
# Enable in a fresh clone with `just bootstrap` (or `lefthook install`).
# Bypass once with `git commit --no-verify` / `LEFTHOOK=0`.

pre-commit:
  jobs:
    # The FAST gate (~3s), deliberately not `just check` (~6min): a six-minute
    # pre-commit gets --no-verify'd within a week, leaving the repo ungated while
    # looking gated. `just check` / `check-all` remain the real gates.
    - name: conventions
      run: just conventions

commit-msg:
  jobs:
    # Conventional Commits, per [tool.commitizen] in pyproject.toml. Was reachable
    # before this only via a hand-written forwarder at .beads/hooks/commit-msg.
    - name: conventional-commits
      run: uv run cz check --commit-msg-file {1}

prepare-commit-msg:
  jobs:
    # The one beads hook still doing real work now that Dolt (not a committed
    # JSONL) is authoritative: agent identity trailers for forensics.
    - name: beads-trailers
      run: bd hooks run prepare-commit-msg {1} {2} {3}

pre-push:
  jobs:
    # bh's multi-host fence (bh-ytbb.12), as a VERB rather than a script this file
    # would have to re-implement (bh-smcj; hooks-as-functionality-adr.md). The verb
    # owns the whole contract — stdin protocol, refs/dolt/data filter, exit codes —
    # so this stays one line and cannot drift from bh's own notion of the fence.
    #
    # use_stdin is REQUIRED: git pipes the ref list to pre-push on stdin. Without it
    # the verb sees nothing to fence. It warns loudly rather than allowing silently
    # in that case, but the fence still would not run — do not remove this.
    #
    # BH_EXEC defaults to the released `bh` on PATH — what every hive that merely
    # CONSUMES bh should use, and what this repo uses once a version is out.
    #
    # This repo also AUTHORS bh, so there is a bootstrap window where the installed
    # binary lags the working tree and a hook would fence against yesterday's code
    # (or fail outright on a verb not yet installed). Export BH_EXEC="uv run bh" to
    # run the source instead:
    #
    #   BH_EXEC="uv run bh" git push        # one-off
    #   export BH_EXEC="uv run bh"          # for a session working on the fence
    #
    # A permanent per-machine override belongs in lefthook-local.yml (gitignored),
    # overriding this job by name — not in this file.
    - name: bh-fence
      run: ${BH_EXEC:-bh} hive hook pre-push
      use_stdin: true
