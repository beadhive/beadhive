epic:
  title: 'SPIKE: remote-only seat access — how a human reaches a conversational seat with no local shell'
  tag: spike
  priority: 2
  component: container
  description: |
    `bh role <seat>` execs `claude --agent bh:<seat>` with INHERITED STDIO (role.py:223). That one
    line is the entire session model: a foreground, TTY-bound process with no identity, no detach,
    no headless mode, and no handle anything else can grab. Close the terminal and the seat dies.

    That is survivable on a laptop. It is not survivable in a container, and the operator's stated
    constraint (2026-08-03) removes the laptop escape entirely: ASSUME THE USER HAS NO EASY LOCAL
    ACCESS. Access is remote, always — browser, ssh jump, or whatever else. So `docker compose
    exec bh bash` cannot be the answer, because it presumes a shell on the host running the
    container.

    SECOND OPERATOR CONSTRAINT: whatever ships as the DEFAULT must not require a plugin. orca is
    acceptable as an option (and is the operator's own preference), but it cannot be the thing
    that makes remote access work at all.

    THE REFRAME that halves this problem. Seats are not all the same shape:

      TRANSACTIONAL  developer, merger — run, exit, side effects in beads and git. Already
                     designed: bh-c6dk's role-binary contract, exit-code taxonomy, and the
                     local/temporal runtimes. These need no terminal and are OUT OF SCOPE here.

      CONVERSATIONAL supervisor, dispatcher, planner — long-lived, human in the loop. Only
                     `bh role` exists for these, and only in foreground-TTY form. THIS MOLECULE
                     IS ABOUT THESE SEATS AND ONLY THESE SEATS.
  design: |
    AMENDED 2026-08-03 BY OPERATOR DIRECTION. The molecule was filed to choose a front door. It now
    builds a SEAM, because the operator stated the destination directly:

        "ultimately a basic terminal attach is good to start, but ultimately we want to integrate
         with other front-ends that replace it using things like orca, openhands, YC QM,
         openchamber"

        "the findings are hard to score, we will report feasibility of multiple options and then
         i will manually choose direction"

    TWO CONSEQUENCES, both structural:

    1. THE TERMINAL IS V1, NOT THE PRODUCT. bh-lx6e.3 is explicitly a bootstrap expected to be
       superseded — built to be replaceable, loopback-only, not gold-plated. The durable asset is
       the seam behind it (bh-lx6e.2), which is why that bead now BLOCKS the seam proof
       (bh-lx6e.4) instead of running beside it.

    2. NO SCORED THRESHOLD. bh-lx6e.2 originally carried a 70/30 bar deciding structured-first vs
       terminal-first. Withdrawn. The spikes now produce COMPARABLE FEASIBILITY PROFILES — one per
       candidate, same five fields — and the operator picks direction from them. bh-lx6e.5 is a
       human decision point, not a derivation.

    THE LAYERING still orders the molecule. If access is always remote then SSH to the factory host
    is the assumed floor — it exists on any Linux host and there is nothing to build. What stacks:

        Layer 1  transport    ssh / docker exec / kubectl exec / smolvm — given, or trivial
        Layer 2  durability   a session that survives client disconnect     <- bh-lx6e.1, root
        Layer 3  seam         what a front end plugs into                   <- bh-lx6e.2, root
        Layer 4  front ends   terminal v1 now; orca / qm / OpenHands later  <- .3, .4

    Layer 2 is not an alternative to anything — a seat that dies when the websocket drops is not a
    seat, so every front end needs it.

    THE FINDING THAT MADE THE TERMINAL THE CHEAP V1, measured 2026-08-03: fastmcp is a CORE
    dependency (pyproject.toml:21, "not an extra"), so starlette, uvicorn, websockets and httpx are
    already in uv.lock and in both image targets. A built-in web terminal is therefore not a new
    dependency, not a new binary, not a licence question, and not a plugin. That is why a ttyd
    sidecar is deliberately NOT spiked here — it is strictly dominated.

    SCOPE. Research only, per docs/spikes/TEMPLATE.md. No product code in any bead. A throwaway
    proof-of-concept used to gather evidence is expected and is not committed.

    RELATED, NOT DUPLICATED: bh-lrcw (qm probe — bh-lx6e.2 must consume its evidence, not re-probe
    qm), bh-xls2.4 / bh-xls2.5 (ACP adapter, permission approvals + chat, Orca-replacement),
    bh-c6dk (transactional seats), bh-jksq (state stream), bh-pc2a.30 (HQ SSH-only — not solved
    here).

issues:
- handle: seat
  title: 'SPIKE: bh seat — durable sessions over a pluggable exec transport'
  type: task
  priority: 1
  component: container
  size: m
  tag: spike
  description: |
    THE ROOT SPIKE. Every front end needs a session that outlives the client, so answer this
    before spiking any of them.

    THE QUESTION. Can ONE verb set — `bh seat ls | attach | kill` — cover at least two exec
    transports (ssh, docker exec, kubectl exec, smolvm) with a terminal multiplexer as the
    durability substrate, such that a conversational seat survives client disconnect and can be
    reattached from a DIFFERENT remote client?

    WHAT IS BROKEN TODAY, precisely. `bh role` builds argv `["claude", "--agent", "bh:<seat>"]`
    and calls `run(argv, capture=False)` — inherited stdio, foreground, exit code propagated
    (role.py:116-126, 223). There is no session name, so nothing can enumerate live seats; no
    detach, so the session is bound to the invoking TTY; and no handle, so no API, UI or second
    operator can reach a running seat.

    NOT ASKING which multiplexer is prettiest. tmux is the obvious candidate on ubiquity and
    footprint; the spike may test an alternative but must justify it on evidence.

    NOT ASKING whether to keep `bh role`. Assume `bh role` remains the foreground path and
    `bh seat` is additive — a spike that concludes otherwise should say so in the recommendation
    rather than assuming it.
  design: |
    Method: prototype the thinnest thing that answers the question, throwaway. Start a seat
    detached inside the beadhive/agent:dev container, disconnect the client hard (kill the
    terminal, not a clean exit), reconnect from a different machine, and verify the seat is still
    live with its scrollback intact.

    Probe specifically:
      - Does a harness running under a multiplexer behave correctly? A TUI is not a plain shell —
        check resize handling, colour, and that the harness does not detect a non-interactive
        stdin and degrade.
      - Transport parity: the same verb over at least two of ssh / docker exec / kubectl exec.
      - What identifies a seat? Bead id, role name, hive, or a composite — and what happens on a
        name collision when two seats want the same role.
      - Cleanup: what reaps a seat whose harness exited, and does `init: true` in the compose
        file (the PID-1 reaper) interact with it.

    Record image-size delta and licence for whatever is added — docs/ASSURANCE.md governs what
    the image may redistribute and tests/test_component_licenses.py fails an undeclared pin.
  acceptance: |
    Verdict doc at docs/spikes/<bead-id>-bh-seat-durable-sessions.md per docs/spikes/TEMPLATE.md,
    all five sections filled, no product code committed.

    GO bar — ALL of the following:
    - A seat started detached survives a HARD client disconnect (killed terminal, not clean exit).
    - Reattach from a DIFFERENT client recovers the live session with scrollback intact.
    - The harness TUI renders correctly under the multiplexer: resize, colour, and no degraded
      non-interactive mode.
    - The same verb set works over at least TWO transports.
    - Licence of anything added to the image is within the ASSURANCE allowed set, and the image
      size delta is measured and stated.

    NO-GO triggers:
    - The harness detects the multiplexer's pty and degrades to non-interactive.
    - Session identity cannot be made stable across a container recreate (which would make
      `bh seat ls` lie after every `down && up`).

- handle: seam
  title: 'SPIKE: front-end seam requirements — one seat interface that terminal, orca, qm and OpenHands can all drive'
  type: task
  priority: 1
  component: container
  size: m
  tag: spike
  description: |
    THE QUESTION. Is there ONE interface a seat can expose that EVERY candidate front end can
    drive — a plain terminal attach, orca, YC's qm, OpenHands, openchamber — or do they require
    genuinely incompatible interfaces?

    REFRAMED 2026-08-03 BY OPERATOR DIRECTION. This bead was originally a "keystroke vs
    bead-decision audit" scored against a 70/30 threshold. That framing is WITHDRAWN. The
    operator's reasoning: the findings are hard to score, and a numeric bar would force a judgment
    they intend to make manually from feasibility evidence. What replaces it is a question evidence
    can still settle without requiring anyone to score anything.

    THE DIRECTION THIS SERVES, in the operator's words: a basic terminal attach is good to START,
    but the intent is to integrate front ends that REPLACE it — orca, OpenHands, qm, openchamber.
    So the durable asset is not the terminal. It is the seam behind it. Get that wrong and every
    front end after the first pays for it, which is precisely why this spike now blocks the
    front-end work rather than sitting beside it.

    WHAT TO ESTABLISH, per candidate front end:
      - What does it need from the thing it drives? A pty? JSON-RPC over stdio (ACP)? An HTTP/SSE
        endpoint? A message queue? Something else?
      - Does it expect to OWN the agent loop, or attach to one that already exists? This is the
        sharpest dividing line in the whole comparison. OpenHands brings its own agent loop —
        adopting it is adopting an orchestrator, not adding a front end. qm is positioned the
        other way, as the human-facing surface over someone else's engine (bh-lrcw).
      - What does it need for PERMISSION APPROVALS specifically? Every candidate must support that
        interaction, so it is the sharpest test of whether one interface can serve them all.
      - What auth model does it assume, and does it compose with a remote-only deployment?

    VERIFY BEFORE COMPARING: confirm openchamber exists and establish what it actually is. It was
    named in the operator's candidate list but its identity is NOT established — the earlier
    analysis flagged it as unverified. Do not report on it from assumption; either cite a source
    or exclude it and say why.

    STILL WORTH CAPTURING, as evidence rather than as a verdict: the distribution of interaction
    types across real dispatcher/supervisor sessions (permission approvals, bead-state decisions
    already expressible as bh verbs, free-form steering, genuinely terminal-shaped work). It tells
    you which parts of the interface carry real weight. NO pass/fail threshold attaches to it —
    that is the scoring the operator explicitly declined.
  design: |
    Method: source-reading plus a live probe where a candidate can be stood up cheaply.

    bh-lrcw is ALREADY standing up a real qm deployment with the Claude Code harness. Consume its
    evidence rather than duplicating it, and coordinate with it rather than re-probing qm from
    scratch — a second independent qm probe is waste, and bh-lrcw was filed specifically so twelve
    downstream questions would not each rediscover qm architecture.

    For each candidate produce THE SAME short profile, so they are comparable side by side:

        interface required        pty / ACP-over-stdio / HTTP+SSE / queue / other
        owns the agent loop?      yes | no        <- the sharpest dividing line
        permission approvals      how it expresses them
        auth model                and whether it composes with remote-only
        what bh must expose       concretely, in terms of a bh verb or endpoint

    The plain terminal attach IS a candidate and gets the same profile. It is the baseline the
    others are measured against, not a special case exempt from the comparison.

    The operator will choose direction manually from these profiles, so the profiles ARE the
    deliverable. Optimize for comparability and honesty over recommendation strength.
  acceptance: |
    Verdict doc at docs/spikes/<bead-id>-frontend-seam-requirements.md per
    docs/spikes/TEMPLATE.md, all five sections filled, no product code.

    REQUIRED CONTENT:
    - Each candidate (terminal attach, orca, qm, OpenHands, openchamber) has a profile covering all
      five fields named in the design section.
    - openchamber identity is CONFIRMED with a cited source, or it is reported as unverifiable and
      excluded with that stated plainly. Never described from assumption.
    - Candidates that expect to OWN the agent loop are flagged as such explicitly — adopting one of
      those is a different decision from adding a front end, and conflating them is the main way
      this comparison could mislead.
    - Interaction-type distribution across at least 5 real dispatcher/supervisor sessions is
      reported as EVIDENCE. No pass/fail threshold attaches to it. (The 70/30 bar this bead
      originally carried is withdrawn by operator direction, 2026-08-03.)

    GO: one interface, or a small NAMED set, is identified that at least the terminal attach, orca
    and qm can all drive — AND what bh must expose to provide it is named concretely enough that an
    implementation molecule could be written from it.

    NO-GO: the candidates require genuinely incompatible interfaces. The verdict then names the
    split and states which subset a single seam CAN serve. A partial seam is a legitimate and
    useful answer; it just has to be stated as partial rather than presented as full coverage.

- handle: serve
  title: 'SPIKE: bh serve — the v1 bootstrap web terminal, on the ASGI stack already in uv.lock'
  type: task
  priority: 1
  component: container
  size: l
  tag: spike
  deps: [seat]
  description: |
    THE QUESTION. Can a pty-over-websocket ship using ONLY what bh already depends on — no new
    dependency, no new binary, no plugin — as the BOOTSTRAP front end for remote seat access?

    SCOPE CORRECTION 2026-08-03, OPERATOR DIRECTION. This bead originally framed the web terminal
    as a candidate PERMANENT default, which drove a large hardening burden. That framing is
    corrected: "a basic terminal attach is good to start, but ultimately we want to integrate with
    other front-ends that replace it using things like orca, openhands, YC's QM, openchamber."

    So this is the V1 BOOTSTRAP, explicitly expected to be superseded. Build it to be REPLACEABLE,
    not permanent. Do not gold-plate it. Its job is to make remote access work at all while the
    front-end seam (bh-lx6e.2) settles what replaces it.

    WHY IT IS STILL THE RIGHT V1. fastmcp is a core dependency, not an extra (pyproject.toml:16-21:
    "Core (not an extra) because the bh claude-plugin auto-registers the MCP server"). It
    transitively resolves starlette, uvicorn, websockets and httpx — all four are in uv.lock today,
    so they are present in every bh install and in both image targets. The server half is already
    paid for; what remains is stdlib `pty`, one websocket route, and a static xterm.js page.
    Nothing to install, nothing to license-review, no plugin. That is what makes it the cheapest
    possible v1, and it is why a ttyd sidecar is deliberately NOT spiked in this molecule — it
    would add a binary and a licence review to buy something already in the tree.

    SECURITY POSTURE FOR V1 — narrowed, NOT relaxed. A write-enabled web terminal is a full shell
    as the agent user: the four volumes, every credential on bh-harness, every hive clone. The
    narrowing is that V1 IS LOOPBACK-ONLY, so the ssh tunnel is the perimeter and the hardening
    needed for a directly-exposed listener does not gate v1. Loopback-only is the SAFEST option,
    not a shortcut — it is a smaller surface than exposing a port and defending it.

    What that buys: non-loopback exposure hardening (token auth, CSWSH/origin rejection, token
    revocation with live session teardown, TLS posture) moves from a v1 gate to a STATED
    PREREQUISITE that must land before any non-loopback listen is permitted. This spike must still
    enumerate those requirements so nobody later exposes the port believing v1 covered it.
  design: |
    Method: throwaway proof-of-concept against a `bh seat` session from the root spike. Prove or
    disprove each property individually — a partial pass is recorded as partial, not rounded up.

    Technical risks worth measuring early, either of which could sink it cheaply:
      - Does stdlib `pty` behave under uvicorn's event loop, or does it need a thread per session?
      - Does running the pty server in the SAME uvicorn process as the MCP server create a coupling
        we do not want (one crash takes both down)? Same process or separate is a real design
        question — answer it with evidence.
  acceptance: |
    Verdict doc at docs/spikes/<bead-id>-bh-serve-v1-web-terminal.md per docs/spikes/TEMPLATE.md,
    all five sections filled, no product code committed (a throwaway proof-of-concept is expected).

    GO bar for V1 — ALL of the following:
    - A working xterm.js terminal drives a `bh seat` session using ONLY dependencies already
      present in uv.lock. Any new dependency is an automatic NO-GO against the no-new-dep premise
      and must be reported as such, not quietly accepted.
    - Binds LOOPBACK ONLY. A non-loopback listen either does not exist in v1 or refuses to start.
    - The SEAT survives a dropped connection end-to-end (bh-lx6e.1 owns the contract; this verifies
      it through the web path).
    - The same-process-as-MCP vs separate-process question is answered with measured evidence — one
      crash taking down both is a real coupling, not a hypothetical.
    - stdlib `pty` behaviour under uvicorn's event loop is characterised (thread-per-session or
      not).

    REQUIRED REGARDLESS OF VERDICT — the exposure prerequisites, enumerated as testable
    requirements even though v1 does not implement them: token auth (not basic), CSWSH/origin
    rejection, token revocation with LIVE session teardown, TLS posture, and how the beadhive-ui
    session becomes the authority rather than a second credential. Written down so nobody later
    exposes the port believing v1 already covered it.

    REQUIRED — replaceability. State what it would take for this to sit behind whatever seam
    bh-lx6e.2 names, so v1 does not have to be unpicked when a real front end arrives. This bead
    does NOT depend on bh-lx6e.2 (the operator wants a terminal working early), so the coupling is
    captured here in writing instead of enforced by a dependency edge.

    Also record what this costs the `core` image target, which ships no harness and may want no
    terminal server at all.

    NO-GO: any new dependency is required, OR the seat does not survive a dropped connection.

- handle: proof
  title: 'SPIKE: prove the front-end seam against orca — without precluding qm, OpenHands or openchamber'
  type: task
  priority: 2
  component: container
  size: s
  tag: spike
  deps: [seat, seam]
  description: |
    THE QUESTION. Does the front-end seam (bh-lx6e.2) actually hold when a REAL external front end
    is plugged into it — proven against orca first — without precluding qm, OpenHands or
    openchamber later, and without orca ever becoming required?

    BROADENED 2026-08-03, OPERATOR DIRECTION. This bead was originally "orca as one transport
    backend". It is now the seam's first proof, because the operator's stated direction makes orca
    an instance of a general pattern rather than a special case: "ultimately we want to integrate
    with other front-ends that replace it using things like orca, openhands, YC's QM, openchamber."

    orca is FIRST for a practical reason, not a strategic one — it is the operator's own preference
    and the one they already run, so it is the cheapest real-world test of a seam that must
    eventually hold several. What this bead proves is the SEAM. orca is the probe.

    THE THREE CONSTRAINTS, all of which must hold simultaneously:

      1. NEVER REQUIRED. The operator was explicit that the shipped default must not need a plugin.
         Remote access must work correctly with orca completely absent. The ABSENT case is the
         actual deliverable here — the happy path proves much less.

      2. MUST NOT PRECLUDE THE OTHERS. A seam shaped tightly around orca that qm or OpenHands
         cannot later use is a failure even if the orca integration works perfectly. Check each
         remaining candidate against the seam using the profiles bh-lx6e.2 produced.

      3. MUST NOT DEEPEN EXISTING COUPLING. bh already integrates orca as a best-effort plugin
         (orca.py) under a deliberately narrow scope invariant: bh touches ONLY orca's `repos`
         list, never `projects`, never `projectHostSetups`, never an orchestration database.
         Meanwhile bh-xls2.5 is the Orca-REPLACEMENT milestone. The direction of travel is away
         from orca, so a front-end backend must not quietly widen the coupling another epic is
         working to remove.

    NOT ASKING whether orca is good. Asking whether the seam holds it at arm's length while still
    being useful — and whether it will hold the next one.
  design: |
    Method: attempt to register orca as a front end behind the seam bh-lx6e.2 established, then
    test the ABSENT case as carefully as the present case — the fallback is the actual deliverable.

    This is deliberately the smallest spike in the molecule. If the seam is right, this is a short
    confirmation; if it is long, the seam is wrong and that is the more valuable finding.
  acceptance: |
    Verdict doc at docs/spikes/<bead-id>-frontend-seam-orca-proof.md per docs/spikes/TEMPLATE.md,
    all five sections filled, no product code committed.

    GO bar — ALL THREE constraints demonstrated, not argued:
    - ABSENT CASE: `bh seat attach` works correctly with orca entirely absent from PATH and no
      orca-data.json present — no degraded behaviour, no confusing error. Demonstrated, since this
      is the constraint the operator actually cares about.
    - PRESENT CASE: orca registers as ONE front end among at least two others, and its use is
      VISIBLE to the operator rather than implicit.
    - DOES NOT PRECLUDE: each remaining candidate from bh-lx6e.2 (qm, OpenHands, openchamber) is
      checked against the seam using that bead's profiles, and any that the seam could NOT serve is
      named explicitly with the reason.
    - SCOPE INVARIANT HELD: orca.py's repos-only boundary is not widened. If the backend would
      require reaching into `projects` or `projectHostSetups`, that is a NO-GO and the specific
      collection is named.

    NO-GO triggers, any one sufficient:
    - Remote access degrades in any way when orca is absent.
    - The seam must reach past orca's repos scope.
    - The seam, as shaped for orca, cannot serve qm — the candidate most likely to be adopted next
      given bh-lrcw is already probing it.

    The recommendation section must state whether this seam conflicts with bh-xls2.5's
    Orca-replacement direction, and if so let bh-lx6e.5 weigh it rather than resolving it here.

- handle: decision
  title: 'DECISION: operator picks the front-end direction from the feasibility profiles'
  type: task
  priority: 1
  component: container
  size: s
  tag: decision
  deps: [seat, seam, serve, proof]
  description: |
    The decision bead for this molecule. Blocked until all four spikes have verdicts.

    THE TWO OPERATOR CONSTRAINTS ARE NON-NEGOTIABLE INPUTS, not preferences to be traded away:
      1. No easy local access. Remote is the only path, always.
      2. The default must not require a plugin. orca may be an option, never the requirement.

    CROSS-MOLECULE INPUTS this decision must weigh rather than ignore:
    - The sibling Track A microVM spike (bh-0gpn.4): a real init changes whether sshd is the
      obvious answer. If that spike went GO, reconsider before defaulting to a web terminal.
    - bh-lrcw (the qm probe): if qm supplies the human-facing surface, part of this molecule is
      superseded rather than merely informed. Check its state before deciding.
    - bh-xls2.4 / bh-xls2.5: the ACP adapter and the permission-approval milestone are where a
      structured-first direction would land.
  design: |
    Consumes the four verdict docs plus the two cross-molecule inputs. Produces one ADR.
  acceptance: |
    This bead does NOT auto-derive a verdict. Per operator direction 2026-08-03 — "we will report
    feasibility of multiple options and then i will manually choose direction" — the spikes report,
    the OPERATOR decides. Its job is to make that choice well-informed and well-recorded.

    READY TO DECIDE when:
    - All four spike verdict docs exist and carry an explicit GO or NO-GO.
    - bh-lx6e.2 has produced a comparable profile for every candidate, in one place.
    - The state of bh-lrcw (qm probe) and of the Track A microVM spike (bh-0gpn.4) is checked and
      recorded, not assumed.

    THE DECISION TO RECORD:
    - Which front end ships as the DEFAULT, and its on/off state in a fresh install.
    - Which front ends are supported alongside it, and how an operator selects one.
    - The SEAM — what bh exposes so a front end can be swapped. This is the durable output; the
      default front end is expected to change, the seam is not.
    - Whether `bh role` stays as-is, gains --detach, or is superseded by `bh seat`.
    - The minimum security posture before any non-loopback listener is permitted, as a testable
      requirement rather than a principle.
    - Whether the answer differs between the `core` and `agent` image targets.

    BOTH OPERATOR CONSTRAINTS must be shown satisfied, point by point.

    ON GO: run `/bh:replan` on this epic to produce the implementation molecule.
    ON NO-GO: an ADR lands under docs/design/ recording what was measured and why nothing was
    adopted, and this epic closes. If the reason is that qm or another external surface supersedes
    it, the ADR names the bead that owns it instead.
