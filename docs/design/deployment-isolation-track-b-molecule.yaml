# after the operator redirected the molecule while it was still kickoff=pending; the beads are
# authoritative (`bh bd show bh-lx6e`). `bh plan file --save` only writes at file time and there
# is no spec export from a filed epic, so this file is maintained by hand or not at all.
#
# HANDLE -> BEAD MAPPING (handles are cosmetic in a snapshot; bead ids are not):
#   seat     -> bh-lx6e.1
#   seam     -> bh-lx6e.2   (filed as handle `audit`; renamed here to match what it became)
#   serve    -> bh-lx6e.3
#   proof    -> bh-lx6e.4   (filed as handle `orca`; broadened past orca)
#   decision -> bh-lx6e.5
#
# WHAT THE AMENDMENT CHANGED, and why this file needed regenerating: the molecule was filed to
# CHOOSE A FRONT DOOR and now BUILDS A SEAM. bh-lx6e.2 was a keystroke-vs-bead-decision audit
# scored against a 70/30 threshold; that bar is withdrawn and it is now a front-end requirements
# spike. bh-lx6e.3 narrowed to a replaceable v1. bh-lx6e.4 broadened from orca to the seam's
